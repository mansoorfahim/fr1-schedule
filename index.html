<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FR1 Security - Guard Shift & Hours Submission Portal</title>
  <style>
    :root {
      --primary: #0b1e36;
      --secondary: #0d6efd;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #dce1e7;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background-color: var(--primary);
      color: #fff;
      padding: 25px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    .header p {
      margin: 5px 0 0 0;
      font-size: 0.95rem;
      opacity: 0.85;
    }
    form {
      padding: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary);
    }
    input[type="text"], input[type="date"], input[type="time"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .day-card {
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .day-header {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shift-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .add-shift-btn {
      background: transparent;
      border: 1px dashed var(--secondary);
      color: var(--secondary);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .add-shift-btn:hover {
      background: rgba(13, 110, 253, 0.05);
    }
    .remove-shift-btn {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .remove-shift-btn:hover {
      background: #ffcdd2;
    }
    .total-box {
      background-color: #eef4ff;
      border: 1px solid #b6d4fe;
      border-radius: 8px;
      padding: 18px;
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-box span {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }
    .total-box input {
      width: 140px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--secondary);
      text-align: right;
      border: none;
      background: transparent;
    }
    button[type="submit"] {
      width: 100%;
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    button[type="submit"]:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>FR1 SECURITY</h1>
    <p>Guard Shift & Hours Submission Portal</p>
  </div>

  <form action="https://formspree.io/f/xrpprkdy" method="POST">
    <input type="hidden" name="subject" value="New Guard Hours Submission - FR1 Security">

    <div class="form-group">
      <label for="guard_name">Guard Full Name</label>
      <input type="text" id="guard_name" name="guard_name" placeholder="First and Last Name" required>
    </div>

    <div class="form-group">
      <label for="week_ending">Week Ending Date</label>
      <input type="date" id="week_ending" name="week_ending" required>
    </div>

    <h3 style="margin-top: 25px; color: #0b1e36;">Daily Shift Log</h3>

    <!-- Dynamic Days Container -->
    <div id="days-container"></div>

    <!-- Live Total Weekly Hours Display -->
    <div class="total-box">
      <span>Total Weekly Hours:</span>
      <input type="text" id="total_hours" name="total_hours" readonly value="0.00 hrs">
    </div>

    <!-- Electronic Signature Field -->
    <div class="form-group" style="margin-top: 25px;">
      <label for="guard_signature">Guard Electronic Signature (Type Full Name)</label>
      <input type="text" id="guard_signature" name="guard_signature" placeholder="Type your full legal name to sign" required>
    </div>

    <button type="submit">Submit Weekly Timesheet</button>
  </form>
</div>

        </div>
      </div>
    `;
    container.innerHTML += dayHtml;
  });
